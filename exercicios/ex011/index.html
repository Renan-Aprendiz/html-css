<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imagens</title>
</head>
<style>
    h1 {
        font-family: arial;
        color: red;
    }
    p {
        font-family: arial;
        color: blueviolet
    }
</style>
<body>
    <h1>Imagens dinamicas</h1>
    <p>imagem 300x300px</p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagem-p.png" type="image/png">
        <source media="(max-width:1050px)" srcset="imagem-m.png" type="image/png"> 
        <img src="imagem-g.png" alt="imagem grande">
    </picture>
    <audio src="midia/musicalobby.mp3" autoplay loop></audio>
</body>
</html>
